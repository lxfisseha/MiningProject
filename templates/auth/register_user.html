<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration | SaaS Portal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .registration-card {
        max-width: 500px;
        width: 100%;
        border-radius: 12px;
      }
      /* Role Selector Grid */
      .role-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 10px;
      }
      .role-option {
        cursor: pointer;
        transition: 0.2s;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        text-align: center;
        padding: 12px 3px;
      }
      .role-input:checked + .role-option {
        border-color: #0d6efd;
        background-color: #f0f7ff;
        color: #0d6efd;
      }
      .role-input {
        display: none;
      }
      .role-option i {
        font-size: 1.25rem;
        display: block;
        margin-bottom: 4px;
      }
      .role-option span {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: lowercase;
      }
      .progress {
        height: 8px;
      }
    </style>
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
      integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
      crossorigin="anonymous"
    ></script>
  </head>
  <body
    class="d-flex align-items-center justify-content-center vh-100 p-3 mt-5 mb-5"
  >
    <div
      id="register-card"
      class="registration-card bg-white shadow-lg overflow-hidden"
    >
      <div class="p-4 border-bottom bg-light">
        <div class="text-center mb-4">
          <h1 class="h3 mb-3 fw-bold text-primary">Registration</h1>
        </div>

        <div class="progress">
          <div
            id="mainProgressBar"
            class="progress-bar progress-bar-striped progress-bar-animated"
            role="progressbar"
            style="width: 33%"
          ></div>
        </div>
      </div>

      <form
        id="regForm"
        novalidate
        method="post"
        enctype="multipart/form-data"
        hx-post="{{ url_for('register') }}"
        hx-target="#form-errors"
        hx-swap="innerHTML"
      >
        <div class="px-4 pt-4">
            <section class="step-pane" id="pane1">
              <div class="mb-3">
                <label for="fullName" class="form-label fw-semibold"
                  >Full Name</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="fullName"
                  name="full_name"
                  required
                  autofocus
                />
              </div>
              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="email" class="form-label fw-semibold"
                    >Email</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label for="phone" class="form-label fw-semibold"
                    >Phone</label
                  >
                  <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    name="phone"
                    required
                  />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Select Role</label>
                <div class="role-grid">
                  {% for role in roles %}
                    <label
                      ><input
                        type="radio"
                        name="role"
                        value="{{role}}"
                        class="role-input"

                      />
                      <div class="role-option">
                        <i class="bi bi-person"></i><span>{{role}}</span>
                      </div>
                    </label>
                  {% endfor %}
                </div>
              </div>

              <div class="row g-2 mb-4">
                <div class="col-md-6">
                  <label for="password" class="form-label fw-semibold"
                    >Password</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                    minlength="8"
                  />
                </div>
                <div class="col-md-6">
                  <label for="confirmPassword" class="form-label fw-semibold"
                    >Confirm</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    required
                  />
                </div>
              </div>

              <button
                type="button"
                class="btn btn-primary w-100 py-2 fw-bold"
              >
                Create Account <i class="bi bi-arrow-right ms-1"></i>
              </button>
              <div class="mt-4">
                <hr />
<!--              <div id="result"></div>-->
              </div>
            </section>
          </div>

      </form>
      <div class="text-center lg-12">
        <p class="text-muted">
          Already have an account?
          <a href="/login" class="text-decoration-none">Sign in</a>
        </p>
      </div>
    </div>
  </body>
</html>
