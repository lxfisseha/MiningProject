{%extends "staff/layouts/base.html"%}

{%block main%}
    <div class="col py-4 px-md-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Manage Requests</h2>
        </div>

        <div class="card border-0 shadow-sm p-4">
            <div class="row g-2 mb-3">
                <div class="col-md-4">
                    <select
                        class="form-select"
                        id="requestTypeFilter"
                        hx-get="{{url_for('get_all_requests_table')}}"
                        hx-target="#requestsContainer"
                        hx-indicator="#loading-indicator"
                        hx-include="#sortingSelector, #requestStatusFilter"
                        hx-trigger="change"
                        name="request_type"
                    >
                    <option value="" selected>All Request Types</option>
                    {%for request_type in request_types%}
                    <option value="{{request_type.value}}">{{request_type.value}}</option>
                    {%endfor%}
                    </select>
                </div>
                <div class="col-md-4">
                    <select
                        id="requestStatusFilter"
                        hx-get="{{url_for('get_all_requests_table')}}"
                        hx-target="#requestsContainer"
                        hx-indicator="#loading-indicator"
                        hx-include="#sortingSelector, #requestTypeFilter"
                        hx-trigger="change"
                        name="status"
                       class="form-select"
                    >
                    <option value="" selected>All Request Statuses</option>
                    {%for status in request_status%}
                    <option value="{{status.value}}">{{status.value}}</option>
                    {%endfor%}
                    </select>
                </div>
                <div class="col-md-4">
                    <select
                        class="form-select"
                        id="sortingSelector"
                        hx-get="{{url_for('get_all_requests_table')}}"
                        hx-target="#requestsContainer"
                        hx-indicator="#loading-indicator"
                        hx-include="#requestTypeFilter, #requestStatusFilter"
                        hx-trigger="change"
                        name="sorting"
                    >
                    <option value="lf">Latest First</option>
                    <option value="of">Oldest First</option>
                    </select>
                </div>
            </div>
            
            <div style="position: relative; min-height: 100px">
                <div
                    id="loading-indicator"
                    class="loading-overlay htmx-indicator justify-content-center py-5"
                >
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
                <div 
                    class="table-responsive"  
                    id="requestsContainer"
                    hx-get="{{url_for('get_all_requests_table')}}"
                    hx-indicator="#loading-indicator"
                    hx-trigger="load">

                </div>
            </div>
    
        </div>
  </div>
</div>
{%endblock%}
