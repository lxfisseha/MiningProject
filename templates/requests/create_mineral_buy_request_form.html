{% extends "requests/create_request_base.html" %}

{%block form_title%}% Mineral Acquisition Request{%{% endblock form_title %}%}

{% block form_body %}
    <form action="#" method="POST">
        
        <div class="section-header mb-3">Requirement Specifications</div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="material_type" class="form-label">Desired Material</label>
                <input type="text" class="form-control" name="material_type" placeholder="e.g. Gemstones" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="quantity" class="form-label">Target Quantity</label>
                <input type="text" class="form-control" name="quantity" placeholder="e.g. 50 KG" required>
            </div>
            <div class="col-md-12 mb-3">
                <label for="location" class="form-label">Preferred Sourcing Location</label>
                <input type="text" class="form-control" name="location" placeholder="e.g. Amhara Region">
            </div>
        </div>

        <div class="section-header mb-3 mt-4">Buyer Information</div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="buyer_name" class="form-label">Full Name / Company Name</label>
                <input type="text" class="form-control" name="buyer_name" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="contact_information" class="form-label">Contact Details (Phone/Email)</label>
                <input type="text" class="form-control" name="contact_information" required>
            </div>
        </div>

        <div class="section-header mb-3 mt-4">Logistics & Intent</div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="self_transportation">
                    <label class="form-check-label" for="self_transportation">We have our own transportation</label>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="self_production">
                    <label class="form-check-label" for="self_production">Interested in direct production partnership</label>
                </div>
            </div>
            <div class="col-12 mt-3 mb-3">
                <label for="collaboration_interest" class="form-label">Collaboration Interest / Special Requirements</label>
                <textarea class="form-control" name="collaboration_interest" rows="4" placeholder="Describe your interest in joint ventures or specific mineral quality requirements..."></textarea>
            </div>
        </div>

        <div class="d-flex justify-content-end mt-5">
            <button type="submit" class="btn btn-primary btn-lg px-5">Submit Request</button>
        </div>
    </form>
{% endblock form_body %}
