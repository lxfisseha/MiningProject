{% extends "auth/auth_base.html" %}
{% block page_styles %}
    <style>
      body {
        background-color: #f8f9fa;
      }
      .registration-card {
        max-width: 500px;
        width: 100%;
        border-radius: 12px;
      }
      /* Role Selector Grid */
      .role-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 10px;
      }
      .role-option {
        cursor: pointer;
        transition: 0.2s;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        text-align: center;
        padding: 12px 3px;
      }
      .role-input:checked + .role-option {
        border-color: #0d6efd;
        background-color: #f0f7ff;
        color: #0d6efd;
      }
      .role-input {
        display: none;
      }
      .role-option i {
        font-size: 1.25rem;
        display: block;
        margin-bottom: 4px;
      }
      .role-option span {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: lowercase;
      }
      .progress {
        height: 8px;
      }
    </style>
{% endblock page_styles %}

{% block body %}
<div
id="body"
    class="d-flex align-items-center justify-content-center vh-100 p-3 mt-5 mb-5"
  >
  {% include 'profiles/_register_profile.html' %}
</div>
{% endblock body %}
