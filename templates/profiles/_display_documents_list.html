{% if user_documents%}

<h6 class="fw-bold small text-uppercase text-muted mb-3">
  Submitted Documents
</h6>
<ul class="list-group list-group-flush border rounded">
  {% for document in user_documents %}
  <li
    class="list-group-item d-flex justify-content-between align-items-center py-3"
  >
    <div class="d-flex align-items-center">
      <i class="bi bi-file-earmark-pdf text-danger fs-4 me-3"></i>
      <div>
        <p class="mb-0 fw-medium">{{document.document_type.value.lower()}}</p>
        <small class="text-muted">Uploaded Oct 15, 2025</small>
      </div>
    </div>
    <div class="btn-group">
      <a
        href="{{url_for('download_document', document_id=document.id)}}"
        target="new"
        class="btn btn-sm btn-light border"
        >View</a
      >
      <!-- <a class="btn btn-sm btn-light border"
        >Replace</a
      > -->
    </div>
  </li>
  {% endfor %}
</ul>
{% endif %}
