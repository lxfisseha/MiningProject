
<div class="modal fade" id="editRequestModal" tabindex="-1" aria-labelledby="editRequestModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-white py-3">
                <h5 class="modal-title fw-bold" id="editRequestModalLabel">Edit Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
        <form 
            hx-patch="{{url_for('update_request_patch', request_id=request_info.id)}}"
            hx-target="#editRequestResult"
            hx-swap="innerHTML"
            hx-indicator="#loading-spinner"
            enctype="multipart/form-data"
            >
            <div class="modal-body p-4">
                {%block form_fields%} {%endblock form_fields%}
                <div id="editRequestResult" class="mt-3"></div>
            </div>
            <div class="modal-footer bg-light border-0">
                <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary px-4">
                    <span id="loading-spinner" class="htmx-indicator spinner-border spinner-border-sm me-2" role="status"></span> 
                    Save Changes
                </button>
                
            </div>
        </form>
    </div>
</div>
</div>
