<div class="row g-3">
  <div class="col-md-6 mb-3">
    <label for="company_name" class="form-label fw-semibold"
      >Company Name</label
    >
    <input
      type="text"
      class="form-control"
      id="company_name"
      name="buyer_profile.company_name"
      required
    />
  </div>
  <div class="col-md-6 mb-3">
    <label for="office_address" class="form-label fw-semibold"
      >Office Address</label
    >
    <input
      type="text"
      class="form-control"
      id="office_address"
      name="buyer_profile.office_address"
      required
    />
  </div>
  <div class="col-12 mb-3">
    <label for="plant_location" class="form-label fw-semibold"
      >Plant Location (Postal Code/ID)</label
    >
    <input
      type="text"
      class="form-control"
      id="plant_location"
      name="buyer_profile.plant_location"
      required
    />
  </div>
  <div class="col-12 mb-3">
    <label for="industry_type" class="form-label fw-semibold"
      >Industry Type & Description</label
    >
    <textarea
      class="form-control"
      id="industry_type"
      name="buyer_profile.industry_type"
      rows="3"
      required
    ></textarea>
  </div>
</div>
