<div class="mb-4 text-center">
  <i class="bi bi-file-earmark-arrow-up text-primary display-6"></i>
  <p class="text-muted small mt-2">
    Please upload the required verification documents.
  </p>
</div>

<div class="mb-4">
  <label for="supporting_document" class="form-label fw-semibold"
    >Supporting Document</label
  >
  <input
    type="file"
    class="form-control"
    id="supporting_document"
    name="supporting_document"
    accept=".pdf,.jpg,.jpeg,.png"
    required
  />
  <div class="form-text">Accepted formats: PDF, JPG, PNG (Max 10MB)</div>
</div>
