{% extends "requests/create_request_base.html" %}

{%block form_title%}% Mineral Acquisition Request{%{% endblock form_title %}%}

{% block form_body %}
    <form hx-post="{{ url_for('create_request_post', request_type=request_types.MINERAL_BUYER.value) }}" hx-target="#create_response" hx-swap="innerHTML" hx-indicator="#loading-spinner">
        
        <div class="section-header mb-3">Requirement Specifications</div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="material_type" class="form-label">Desired Material</label>
                <input type="text" class="form-control" name="mineral_buy_request.material_type" placeholder="e.g. Gemstones" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="quantity" class="form-label">Target Quantity</label>
                <input type="text" class="form-control" name="mineral_buy_request.quantity" placeholder="e.g. 50 KG" required>
            </div>
            <div class="col-md-12 mb-3">
                <label for="location" class="form-label">Preferred Sourcing Location</label>
                <input type="text" class="form-control" name="mineral_buy_request.location" placeholder="e.g. Amhara Region">
            </div>
        </div>

        <div class="section-header mb-3 mt-4">Buyer Information</div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="buyer_name" class="form-label">Full Name / Company Name</label>
                <input type="text" class="form-control" name="mineral_buy_request.buyer_name" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="contact_information" class="form-label">Contact Details (Phone/Email)</label>
                <input type="text" class="form-control" name="mineral_buy_request.contact_information" required>
            </div>
        </div>

        <div class="section-header mb-3 mt-4">Logistics & Intent</div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="mineral_buy_request.self_transportation">
                    <label class="form-check-label" for="self_transportation">We have our own transportation</label>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="mineral_buy_request.self_production">
                    <label class="form-check-label" for="self_production">Interested in direct production partnership</label>
                </div>
            </div>
            <div class="col-12 mt-3 mb-3">
                <label for="collaboration_interest" class="form-label">Collaboration Interest / Special Requirements</label>
                <textarea class="form-control" name="mineral_buy_request.collaboration_interest" rows="4" placeholder="Describe your interest in joint ventures or specific mineral quality requirements..."></textarea>
            </div>
        </div>

        <div id="create_response"></div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary btn-lg px-5"><span id="loading-spinner" class="htmx-indicator spinner-border spinner-border-sm me-2" role="status"></span>Submit Request</button>
        </div>
    </form>
{% endblock form_body %}
