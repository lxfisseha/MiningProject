<div class="mb-4 text-center">
  <i class="bi bi-file-earmark-arrow-up text-primary display-6"></i>
  <p class="text-muted small mt-2">
    Please upload the required verification documents.
  </p>
</div>
<div class="mb-4">
  <label for="trade_license_document" class="form-label fw-semibold"
    >Trade License Document</label
  >
  <input
    type="file"
    class="form-control"
    id="trade_license_document"
    name="documents.trade_license_document"
    accept=".pdf,.jpg,.jpeg,.png"
    required
  />
  <div class="form-text">Supported formats: PDF, JPG, PNG</div>
</div>

<div class="mb-4">
  <label for="national_id_document" class="form-label fw-semibold"
    >National ID Document</label
  >
  <input
    type="file"
    class="form-control"
    id="national_id_document"
    name="documents.national_id_document"
    accept=".pdf,.jpg,.jpeg,.png"
    required
  />
  <div class="form-text">
    Please upload a clear scan of your ID (PDF or Image)
  </div>
</div>
