<div class="mb-4">
  <label for="license_certificate_document" class="form-label fw-semibold"
    >License Certificate</label
  >
  <input
    type="file"
    class="form-control"
    id="license_certificate_document"
    name="license_holder_profile.license_certificate_document"
    accept=".pdf,.jpg,.jpeg,.png"
    required
  />
  <div class="form-text">Accepted: PDF, JPG, PNG (Max 5MB)</div>
</div>

<div class="mb-4">
  <label for="geological_report_document" class="form-label fw-semibold"
    >Geological Report</label
  >
  <input
    type="file"
    class="form-control"
    id="geological_report_document"
    name="license_holder_profile.geological_report_document"
    accept=".pdf,.doc,.docx"
    required
  />
  <div class="form-text">Accepted: PDF, DOC, DOCX</div>
</div>

<div class="mb-4">
  <label for="national_id_document" class="form-label fw-semibold"
    >National ID / Passport</label
  >
  <input
    type="file"
    class="form-control"
    id="national_id_document"
    name="license_holder_profile.national_id_document"
    accept=".pdf,.jpg,.jpeg,.png"
    required
  />
  <div class="form-text">
    Provide a clear scanned copy of your identification
  </div>
</div>
