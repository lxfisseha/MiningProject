{%extends "staff/layouts/base.html"%}


{%block main%}
        <div class="col py-4 px-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Pending Users </h2>
            </div>

            <div class="card border-0  shadow-sm p-4" >
                <div class="mb-4">
                    <div class="input-group" style="max-width: 350px;">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                        <input               
                            id="userSearch"
                            hx-get="{{url_for('get_pending_users_table')}}"
                            hx-target="#usersContainer"
                            hx-indicator="#loading-indicator"
                            hx-trigger="change" 
                            name="search"
                            type="text" 
                            class="form-control border-start-0"
                            placeholder="Search email or name..."
                            >
                    </div>
                </div>
                <div style="position: relative; min-height: 100px;">
                    <div id="loading-indicator" class="loading-overlay htmx-indicator justify-content-center py-5 ">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                    <div class="table-responsive"
                        id="usersContainer"
                        hx-get="{{url_for('get_pending_users_table')}}"
                        hx-indicator="#loading-indicator"
                        hx-trigger="load"
                    >
                    </div>
                </div>
                
            
            </div>
        </div>
{%endblock main%}
