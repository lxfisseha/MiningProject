<div class="role-section">
    <div class="row g-3">
        <div class="col-12">
            <label class="form-label small fw-bold text-muted text-uppercase">Company Name</label>
            <input type="text" class="form-control" name="equipment_owner_profile.company_name" value="{{current_user.equipment_owner_profile.company_name}}">
        </div>
        <div class="col-12">
            <label class="form-label small fw-bold text-muted text-uppercase">Office Address</label>
            <input type="text" class="form-control" name="equipment_owner_profile.office_address" value="{{current_user.equipment_owner_profile.office_address}}">
        </div>
        <div class="col-12">
            <label class="form-label small fw-bold text-muted text-uppercase">Equipment Types Owned</label>
            <textarea name="equipment_owner_profile.equipment_types_owned" class="form-control" rows="3">{{current_user.equipment_owner_profile.equipment_types_owned}}</textarea>
            <div class="form-text">List the primary categories of equipment available for lease or use.</div>
        </div>
    </div>
</div>
