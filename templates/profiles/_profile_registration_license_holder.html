<div class="row g-3">
  <div class="col-md-6 mb-2">
    <label
      for="license_holder_profile.company_name"
      class="form-label fw-semibold"
      >Company Name</label
    >
    <input
      type="text"
      class="form-control"
      id="company_name"
      name="license_holder_profile.company_name"
      required
    />
  </div>
  <div class="col-md-6 mb-2">
    <label
      for="license_holder_profile.license_type"
      class="form-label fw-semibold"
      >License Type</label
    >
    <select
      class="form-select"
      id="license_type"
      name="license_holder_profile.license_type"
      required
    >
      <option value="" selected disabled>Select license type...</option>
      {% for license_type in license_types %}
      <option value="{{ license_type.value }}">{{ license_type.value }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12 mb-2">
    <label
      for="license_holder_profile.office_address"
      class="form-label fw-semibold"
      >Registered Office Address</label
    >
    <input
      type="text"
      class="form-control"
      id="office_address"
      name="license_holder_profile.office_address"
      required
    />
  </div>
  <div class="col-12 mb-2">
    <label
      for="license_holder_profile.site_address"
      class="form-label fw-semibold"
      >Operation Site Address</label
    >
    <input
      type="text"
      class="form-control"
      id="site_address"
      name="license_holder_profile.site_address"
      required
    />
  </div>
  <div class="col-md-6 mb-3">
    <label
      for="license_holder_profile.material_type"
      class="form-label fw-semibold"
      >Material Type</label
    >
    <input
      type="text"
      class="form-control"
      id="material_type"
      name="license_holder_profile.material_type"
      required
    />
  </div>
  <div class="col-md-6 mb-2">
    <label
      for="license_holder_profile.license_number"
      class="form-label fw-semibold"
      >License Number
      <span class="text-muted fw-normal">(Optional)</span></label
    >
    <input
      type="text"
      class="form-control"
      id="license_number"
      name="license_holder_profile.license_number"
    />
  </div>
</div>
