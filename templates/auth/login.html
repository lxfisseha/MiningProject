<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Secure Portal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
      integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
      crossorigin="anonymous"
    ></script>
    <style>
      /* Minimal custom CSS for specific layout requirements not covered by utility classes */
      body {
        background-color: #f8f9fa;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
      }
      #result p {
        background-color: #e9ecef;
        padding: 1rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <main
      class="container d-flex align-items-center justify-content-center vh-100"
    >
      <div class="login-card">
        <div class="text-center mb-4">
          <h1 class="h3 mb-3 fw-bold text-primary">Minning Support Platform</h1>
          <p class="text-muted">Please sign in to your account</p>
        </div>

        <div class="card shadow-lg border-0">
          <div class="card-body p-4">
            <form
              method="POST"
              hx-post="{{url_for('login_post')}}"
              hx-target="#result"
              hx-swap="innerHTML"
            >
              <div class="mb-3">
                <label for="emailAddress" class="form-label fw-semibold"
                  >Email address</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="emailAddress"
                  name="username"
                  required
                  autofocus
                />
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between">
                  <label for="userPassword" class="form-label fw-semibold"
                    >Password</label
                  >
                  <a href="#" class="text-decoration-none small"
                    >Forgot password?</a
                  >
                </div>
                <input
                  type="password"
                  class="form-control"
                  id="userPassword"
                  name="password"
                  required
                />
              </div>

              <div class="mb-4 form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="rememberMe"
                />
                <label class="form-check-label text-muted" for="rememberMe">
                  Remember me
                </label>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                Login
              </button>
              <div class="mt-4">
                <hr />
                <p id="result"></p>
              </div>
            </form>
          </div>
        </div>

        <div class="text-center mt-4">
          <p class="text-muted">
            Don’t have an account?
            <a href="{{url_for('registration_form')}}" class="text-decoration-none">Sign up</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
