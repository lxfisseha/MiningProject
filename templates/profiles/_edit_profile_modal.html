<div class="modal fade" id="accountSettingsModal" tabindex="-1" aria-labelledby="accountSettingsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="accountSettingsModalLabel">Edit Profile</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <ul class="nav nav-tabs mb-4" id="settingsTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="user-info-tab" data-bs-toggle="tab" data-bs-target="#user-info" type="button" role="tab" aria-controls="user-info" aria-selected="true">User Information</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="profile-info-tab" data-bs-toggle="tab" data-bs-target="#profile-info" type="button" role="tab" aria-controls="profile-info" aria-selected="false">Profile Information</button>
          </li>
        </ul>

        <div class="tab-content" id="settingsTabsContent">

          <div class="tab-pane fade show active" id="user-info" role="tabpanel" aria-labelledby="user-info-tab">
              {% include 'profiles/_edit_user_form.html' %}
          </div>

          <div class="tab-pane fade" id="profile-info" role="tabpanel" aria-labelledby="profile-info-tab">
              {% include 'profiles/_edit_profile_form.html' %}
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
