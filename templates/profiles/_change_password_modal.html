<div
  class="modal fade"
  id="changePasswordModal"
  tabindex="-1"
  aria-labelledby="changePasswordModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-bottom-0 pt-4 px-4">
        <h5 class="modal-title fw-bold" id="changePasswordModalLabel">
          Change Password
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body px-4">
        <p class="text-muted small mb-4">
          Please enter your current password and choose a strong new one to keep
          your account secure.
        </p>

        <form
          id="passwordForm"
          class="needs-validation"
          novalidate
          hx-post="{{url_for('change_password')}}"
          hx-target="#password_change_msg"
        >
          <div class="mb-3">
            <label
              for="currentPassword"
              class="form-label small fw-bold text-uppercase"
              >Current Password</label
            >
            <input
              type="password"
              class="form-control"
              name="current_password"
              id="currentPassword"
              required
            />
            <div class="invalid-feedback">
              Please enter your current password.
            </div>
          </div>

          <hr class="my-4 opacity-50" />

          <div class="mb-3">
            <label
              for="newPassword"
              class="form-label small fw-bold text-uppercase"
              >New Password</label
            >
            <input
              type="password"
              class="form-control"
              name="new_password"
              id="newPassword"
              minlength="8"
              required
            />
            <div id="passwordHelp" class="form-text mt-1">
              Password must be at least 8 characters long.
            </div>
            <div class="invalid-feedback">
              Password must be at least 8 characters.
            </div>
          </div>

          <div class="mb-4">
            <label
              for="confirmPassword"
              class="form-label small fw-bold text-uppercase"
              >Confirm New Password</label
            >
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              required
            />
            <div class="invalid-feedback" id="confirmFeedback">
              Passwords must match.
            </div>
          </div>
          <div id="password_change_msg"></div>

          <div class="modal-footer border-top-0 px-0 pb-3 d-flex gap-2">
            <button
              type="button"
              class="btn btn-light border flex-grow-1 fw-semibold"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="btn btn-primary flex-grow-1 fw-semibold disabled"
              id="updatepasswordbtn"
            >
              Update Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  (() => {
    "use strict";
    const form = document.getElementById("passwordForm");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const updatebtn = document.getElementById("updatepasswordbtn");

    function validatePasswordChangeForm() {
      if (newPassword.value !== confirmPassword.value) {
        confirmPassword.setCustomValidity("Passwords do not match");
      } else {
        confirmPassword.setCustomValidity("");
        updatebtn.classList.remove("disabled");
      }

      form.classList.add("was-validated");
    }

    // Real-time reset of validity when typing
    confirmPassword.addEventListener("input", () => {
      validatePasswordChangeForm();
    });
  })();
</script>
