{%extends 'requests/layouts/_create_request_base.html'%}

{%block form_title%}Create Consultance Request{%endblock form_title%}

{% block form_content %}
    <div class="row">
        <div class="col-md-6 mb-3">
                <label for="consultancy_type"  class="form-label">Consultancy Type</label>
                <select class="form-select" name="consulting_request.consultancy_type" id="consultancy_type" required>
                    <option value="" selected disabled>Choose a service...</option>
                    {% for consultancy_type in consultancy_types %}
                    <option value="{{consultancy_type.value}}">{{consultancy_type.value}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label for="study_level" class="form-label">Study Level</label>
                <select class="form-select" name="consulting_request.study_level" id="study_level" required>
                    <option value="" selected disabled>Select level...</option>
                    {% for study_level in study_levels %}
                    <option value="{{study_level.value}}">{{study_level.value}}</option>
                    {% endfor %}                                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label for="expert_type" class="form-label">Expert Type Required</label>
                <input type="text" class="form-control" id="expert_type" name="consulting_request.expert_type" placeholder="e.g. Senior Geologist" required>
            </div>
            <div class="col-md-6 d-flex align-items-center mb-3">
                <div class="form-check form-switch mt-md-4">
                    <input name="consulting_request.drill_machine_required"  class="form-check-input" type="checkbox" id="drill_machine_required">
                    <label class="form-check-label ms-2" for="drill_machine_required">Drill Machine Required?</label>
                </div>
            </div>
        </div>

        <hr class="my-4">

        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="location" class="form-label">Location (Region/Woreda)</label>
                <input type="text" class="form-control" name="consulting_request.location" id="location" placeholder="Site location" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="material_type" class="form-label">Material Type</label>
                <input type="text" name="consulting_request.material_type" class="form-control" id="material_type" placeholder="e.g. Gold, Lithium, Coal" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="license_holder_name" class="form-label">License Holder Name</label>
                <input type="text" class="form-control" name="consulting_request.license_holder_name" id="license_holder_name" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="license_number" class="form-label">License Number</label>
                <input type="text" class="form-control" name="consulting_request.license_number" id="license_number" required>
            </div>
        </div>

        <hr class="my-4">
        <h5 class="mb-3">Technical Documents</h5>
        <div class="row">
            <div class="col-md-12 mb-3">
                <label for="license_certificate_document" class="form-label">License Certificate (PDF/Image)</label>
                <input type="file" class="form-control" name="documents.license_certificate_document" id="license_certificate_document" required>
            </div>
        </div>


        <div id="create_response"></div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary btn-lg px-5"><span id="loading-spinner" class="htmx-indicator spinner-border spinner-border-sm me-2" role="status"></span>Submit Request</button>
        </div>
{% endblock form_content %}
