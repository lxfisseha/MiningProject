<form
  hx-patch="{{url_for('edit_user')}}"
  hx-target="#edit_user_results"
  hx-swap="innerHTML"
  hx-indicator="#loading-spinner"
>
  <div
    class="tab-pane fade show active"
    id="user-info"
    aria-labelledby="user-info-tab"
  >
    <div class="row g-3">
      <div class="col-md-6">
        <label
          class="form-label small fw-bold text-muted text-uppercase"
          >Full Name</label
        >
        <input
          type="text"
          class="form-control"
          name="full_name"
          value="{{current_user.full_name}}"
          required
        />
      </div>
      <div class="col-md-6">
        <label
          class="form-label small fw-bold text-muted text-uppercase"
          >Email Address</label
        >
        <input
          type="email"
          name="email"
          class="form-control"
          value="{{current_user.email}}"
          required
        />
      </div>
      <div class="col-md-6">
        <label
          class="form-label small fw-bold text-muted text-uppercase"
          >Phone Number</label
        >
        <input
          type="tel"
          name="phone"
          class="form-control"
          value="{{current_user.phone}}"
        />
      </div>
      <div class="col-md-6">
        <label
          class="form-label small fw-bold text-muted text-uppercase"
          >Preferred Language</label
        >
        <select class="form-select" name="preferred_language">
          <option value="en" {%if current_user.preferred_language.lower() =="en"  %}selected{%endif%}  >English</option>
          <option value="am" {%if current_user.preferred_language.lower() =="am"  %}selected{%endif%} >Amharic (አማርኛ)</option>
        </select>
      </div>
      <div class="col-12 mb-4">
        <label
          class="form-label small fw-bold text-muted text-uppercase"
          >Role:
        </label>
        <input
          type="text"
          class="form-control bg-light"
          value="{{current_user.role.value}}"
          readonly
          disabled
        />
      </div>
    </div>
  </div>

<div id="edit_user_results" class="mt-0 mb-3"></div>

  <div class="d-flex justify-content-end gap-2 pt-3 border-top">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary px-4 ">
      <span id="loading-spinner" class="htmx-indicator spinner-border spinner-border-sm me-2" role="status"></span>
      Save Changes
 </button>
  </div>
</form>
