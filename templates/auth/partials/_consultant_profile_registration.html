<div class="row g-3">
  <div class="col-md-6 mb-2">
    <label for="company_name" class="form-label fw-semibold"
      >Company Name</label
    >
    <input
      type="text"
      class="form-control"
      id="company_name"
      name="consultant_profile.company_name"
      required
    />
  </div>
  <div class="col-md-6 mb-2">
    <label for="office_address" class="form-label fw-semibold"
      >Office Address</label
    >
    <input
      type="text"
      class="form-control"
      id="office_address"
      name="consultant_profile.office_address"
      required
    />
  </div>
  <div class="col-12 mb-2">
    <label for="years_of_experiance" class="form-label fw-semibold"
      >Years of Experience</label
    >
    <input
      type="number"
      class="form-control"
      id="years_of_experiance"
      name="consultant_profile.years_of_experience"
      min="0"
      required
    />
  </div>
  <div class="col-12 mb-3">
    <label for="experties_areas" class="form-label fw-semibold"
      >Expertise Areas</label
    >
    <textarea
      class="form-control"
      id="experties_areas"
      name="consultant_profile.expertise_areas"
      rows="5"
      required
    ></textarea>
  </div>
</div>
